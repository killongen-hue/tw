<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Tagwerk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: ein Bildschirm. Kopfzeile fest, darunter scrollt das Zeitraster. Uhrzeiten in Mono wie im Fahrplan, die rote Jetzt-Linie ist der einzige Signalton. */
:root{
  --bg:#F2F4F7;
  --surface:#FFFFFF;
  --surface-2:#E7EBF0;
  --ink:#13202C;
  --ink-2:#566472;
  --line:#D9E0E7;
  --line-soft:#E9EDF2;
  --accent:#13202C;
  --on-accent:#FFFFFF;
  --now:#E0412B;
  --on-now:#FFFFFF;
  --focus:#2A6BE8;
  --k-blue:#2A62D6;
  --k-green:#1F8A57;
  --k-amber:#C57A0A;
  --k-red:#CC3B3B;
  --k-violet:#7A4FD0;
  --k-slate:#5C6B7A;
  --shadow:0 6px 24px rgba(19,32,44,.16);
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151C;--surface:#16202A;--surface-2:#202C39;--ink:#E7EDF3;--ink-2:#93A1AF;--line:#2A3846;--line-soft:#1F2B37;
    --accent:#E7EDF3;--on-accent:#0E151C;--now:#FF6A52;--on-now:#1A0A07;--focus:#7FA8FF;
    --k-blue:#7AA2FF;--k-green:#4FC58B;--k-amber:#F0B04A;--k-red:#FF7A7A;--k-violet:#B093FF;--k-slate:#9DABB9;
    --shadow:0 8px 28px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151C;--surface:#16202A;--surface-2:#202C39;--ink:#E7EDF3;--ink-2:#93A1AF;--line:#2A3846;--line-soft:#1F2B37;
  --accent:#E7EDF3;--on-accent:#0E151C;--now:#FF6A52;--on-now:#1A0A07;--focus:#7FA8FF;
  --k-blue:#7AA2FF;--k-green:#4FC58B;--k-amber:#F0B04A;--k-red:#FF7A7A;--k-violet:#B093FF;--k-slate:#9DABB9;
  --shadow:0 8px 28px rgba(0,0,0,.55);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.4 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.k-blue{--k:var(--k-blue)}.k-green{--k:var(--k-green)}.k-amber{--k:var(--k-amber)}
.k-red{--k:var(--k-red)}.k-violet{--k:var(--k-violet)}.k-slate{--k:var(--k-slate)}

#app{height:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;min-width:0}
.top{flex:none;padding-top:10px}
.titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-width:0}
.ttl{min-width:0}
.kicker{display:block;font:500 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:3px 0 0;font:600 22px/1.15 var(--font);letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.nav{display:flex;gap:6px;flex:none}
.ibtn{min-width:40px;height:40px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font:500 13px/1 var(--font)}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;margin:12px 0 8px;padding:3px;background:var(--surface-2);border-radius:12px}
.tabs button{min-height:40px;padding:0 2px;border:0;background:transparent;color:var(--ink-2);border-radius:9px;font:500 13px/1 var(--font)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}

#main{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;position:relative;padding-bottom:76px;overscroll-behavior:contain;touch-action:pan-y pinch-zoom}
@keyframes slideNext{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slidePrev{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
#main.slide-next>*{animation:slideNext .2s ease-out}
#main.slide-prev>*{animation:slidePrev .2s ease-out}
.hint{margin:6px 0;color:var(--ink-2);font-size:13px}
.hint.warn{color:var(--k-red)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 10px;padding:9px 12px;background:var(--surface-2);border-radius:10px;font-size:13px;color:var(--ink-2)}
.banner button{flex:none;border:0;background:transparent;color:var(--ink);font-weight:600;text-decoration:underline;padding:6px 2px}

/* Zeitraster */
.strip{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.pill{display:flex;align-items:center;gap:8px;min-width:0;padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.25;cursor:pointer;background:var(--surface);border:1px solid var(--line)}
.pill.ev{background:color-mix(in srgb,var(--k) 16%,var(--surface));color:color-mix(in srgb,var(--k) 62%,var(--ink));border-color:color-mix(in srgb,var(--k) 40%,transparent);font-weight:600}
.pill.todo.done .pt,.blk.todo.done .bt,.row.done .rtitle{text-decoration:line-through;color:var(--ink-2)}
.pt{min-width:0;overflow-wrap:anywhere}
.dotk{width:8px;height:8px;border-radius:50%;background:var(--k,var(--ink-2));flex:none}

.grid{display:grid;grid-template-columns:44px minmax(0,1fr);margin-top:14px;min-width:0}
.gutter{position:relative;height:calc(24*var(--hh))}
.gutter span{position:absolute;right:8px;transform:translateY(-50%);font:400 11px/1 var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.gutter span:first-child{transform:none}
.cols{
  position:relative;height:calc(24*var(--hh));min-width:0;
  background-color:var(--surface);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(var(--line-soft) 1px,transparent 1px);
  background-size:100% var(--hh),100% calc(var(--hh)/2);
  border-left:1px solid var(--line);border-bottom:1px solid var(--line);
  cursor:cell;
}
.cols.today{background-color:color-mix(in srgb,var(--now) 5%,var(--surface))}
.blk{
  position:absolute;overflow:hidden;display:flex;flex-direction:column;gap:1px;min-width:0;
  padding:4px 6px;border-radius:6px;font-size:12.5px;line-height:1.25;cursor:pointer;
  background:color-mix(in srgb,var(--k) 16%,var(--surface));
  color:color-mix(in srgb,var(--k) 62%,var(--ink));
  border:1px solid color-mix(in srgb,var(--k) 40%,transparent);
}
.blk .bt{font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:0}
.blk .bm{font:400 11px/1.2 var(--mono);opacity:.85;white-space:nowrap}
.blk.short{flex-direction:row;align-items:center;gap:6px;padding:2px 6px}
.blk.short .bt{flex:1;white-space:nowrap}
.blk.short .bm{flex:none}
.blk.cmp{padding:2px 3px;font-size:10.5px;border-radius:4px}
.blk.cmp .bm{display:none}
.blk.todo{--k:var(--ink-2);flex-direction:row;align-items:flex-start;gap:6px;background:var(--surface);color:var(--ink);border-style:dashed}
.blk.todo.cmp{padding:2px 3px}
.blk.todo.done{opacity:.6}
.mini{flex:none;width:18px;height:18px;margin-top:1px;padding:0;border:2px solid var(--ink-2);border-radius:5px;background:transparent;display:grid;place-items:center;color:var(--on-accent)}
.mini svg{opacity:0}
.mini[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.mini[aria-pressed="true"] svg{opacity:1}
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--now);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-6px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--now)}

/* Woche */
.wk-head{position:sticky;top:0;z-index:6;display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));padding-top:4px;background:var(--bg)}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border:0;background:transparent;font:500 11px/1 var(--mono);text-transform:uppercase;color:var(--ink-2)}
.wd b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font:600 16px/1 var(--font);color:var(--ink)}
.wd.today b{background:var(--now);color:var(--on-now)}
.wk-allday{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));margin-top:4px}
.wk-cell{display:flex;flex-direction:column;gap:2px;min-width:0;padding:0 1px}
.pill.xs{padding:2px 4px;border-radius:4px;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pill.xs.todo{font-weight:400;border-style:dashed}
.wgrid{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));margin-top:6px}
.wgrid .gutter span{right:4px;font-size:10px}

/* Monat */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:6px}
.mh{padding:6px 0;background:var(--bg);text-align:center;font:500 11px/1 var(--mono);color:var(--ink-2);text-transform:uppercase}
.mc{min-height:58px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:var(--surface);color:var(--ink);font:500 14px/1 var(--font)}
.mc.out{background:color-mix(in srgb,var(--surface) 65%,var(--bg));color:var(--ink-2)}
.mc.sel{outline:2px solid var(--accent);outline-offset:-2px}
.mc .num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%}
.mc.today .num{background:var(--now);color:var(--on-now)}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;min-height:7px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--k)}
.dot.sq{border-radius:1.5px;background:transparent;border:1.5px solid var(--ink-2)}
.selday{margin-top:16px}
.sd-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.sd-head h2{margin:0;font:600 16px/1.2 var(--font)}

/* Listen */
.rows{display:flex;flex-direction:column;gap:6px;min-width:0}
.row{display:grid;grid-template-columns:84px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 12px 8px 8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;cursor:pointer;min-width:0}
.row .rt{display:flex;align-items:center;gap:4px;font:400 12px/1.2 var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums;padding-left:4px}
.row .rtitle{min-width:0;overflow-wrap:anywhere;font-weight:500}
.row.ev .rt{padding-left:4px}
.row.trow{grid-template-columns:auto minmax(0,1fr)}
.rmain{display:flex;flex-direction:column;gap:2px;min-width:0}
.rmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font:400 12px/1.3 var(--mono);color:var(--ink-2)}
.rmeta.late{color:var(--k-red)}
.tag{display:inline-block;padding:1px 6px;border-radius:5px;font:500 11px/1.4 var(--font);background:color-mix(in srgb,var(--k) 16%,var(--surface));color:color-mix(in srgb,var(--k) 62%,var(--ink))}
.cbx{flex:none;width:32px;height:32px;padding:0;border:0;background:transparent;display:grid;place-items:center;color:var(--on-accent)}
.cbx i{display:grid;place-items:center;width:22px;height:22px;border:2px solid var(--ink-2);border-radius:7px}
.cbx svg{opacity:0}
.cbx[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent)}
.cbx[aria-pressed="true"] svg{opacity:1}

.ag-day{display:grid;grid-template-columns:60px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.ag-date{font:500 11px/1.2 var(--mono);text-transform:uppercase;color:var(--ink-2)}
.ag-date b{display:block;margin:3px 0;font:600 26px/1 var(--font);color:var(--ink);text-transform:none}
.ag-day.over .ag-date{color:var(--k-red)}
.ag-rows{display:flex;flex-direction:column;gap:6px;min-width:0}
.more{display:flex;justify-content:center;padding:14px 0}

.quick{display:flex;gap:8px;margin:6px 0 10px}
.quick input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2);font:500 13px/1 var(--font)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.prog{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:13px;color:var(--ink-2)}
.prog span.bar{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog span.bar i{display:block;height:100%;background:var(--accent)}
.sec{margin-top:14px}
.sec h2{margin:0 0 8px;font:500 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.sec.late h2{color:var(--k-red)}

/* Eingabefelder und Knöpfe */
input[type="text"],input[type="date"],input[type="time"],select,textarea{
  width:100%;min-width:0;min-height:44px;padding:10px 12px;
  font:inherit;font-size:16px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;
}
textarea{resize:vertical;min-height:76px}
input:disabled,select:disabled{opacity:.5}
.btn{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 15px/1 var(--font)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--k-red)}
.fab{
  position:fixed;z-index:20;display:flex;align-items:center;gap:8px;height:52px;padding:0 20px 0 16px;border:0;border-radius:26px;
  right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:var(--accent);color:var(--on-accent);font:600 15px/1 var(--font);box-shadow:var(--shadow);
}

/* Eingabeblatt */
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,18,26,.5)}
.sheet{
  width:100%;max-width:560px;max-height:calc(100% - 16px);overflow:auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--surface);color:var(--ink);border-radius:18px 18px 0 0;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:14px;
}
@media (min-width:640px){#sheet{align-items:center}.sheet{border-radius:18px}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sh-head h2{margin:0;font:600 18px/1.2 var(--font)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:2px;flex:1;padding:3px;background:var(--surface-2);border-radius:12px}
.seg button{min-height:38px;border:0;border-radius:9px;background:transparent;color:var(--ink-2);font:500 14px/1 var(--font)}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.lbl{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.chk-line{display:flex;align-items:center;gap:10px;min-height:36px;font-size:15px}
.chk-line input{width:20px;height:20px;accent-color:var(--accent)}
.swatches,.optrow{display:flex;flex-wrap:wrap;gap:6px}
.sw-w{position:relative}
.sw-w input{position:absolute;opacity:0;width:1px;height:1px}
.sw{display:flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:var(--surface);cursor:pointer}
.sw i{width:10px;height:10px;border-radius:50%;background:var(--k,var(--ink-2))}
.sw-w input:checked+.sw{border-color:var(--ink);background:var(--surface-2);font-weight:600}
.sw-w input:focus-visible+.sw{outline:2px solid var(--focus);outline-offset:2px}
.actions{display:flex;align-items:center;gap:8px;margin-top:2px}
.actions .sp{flex:1}
.err{margin:0;font-size:13px;color:var(--k-red)}
.setrow{display:flex;align-items:flex-start;gap:12px;font-size:15px}
.setrow input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.setrow small{display:block;color:var(--ink-2);font-size:13px}
.note{margin:0;font-size:13px;color:var(--ink-2)}

/* Erinnerungen */
#alerts{
  position:fixed;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  top:calc(env(safe-area-inset-top,0px) + 8px);
  left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
}
.alert{
  pointer-events:auto;width:100%;max-width:520px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;
  padding:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
}
.al-ic{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--now);color:var(--on-now)}
.al-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.al-t{overflow-wrap:anywhere}
.al-m{font-size:12px;color:var(--ink-2)}
.al-act{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
#toast{
  position:fixed;z-index:50;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;
  bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);
  padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:14px;
}
#toast button{border:0;background:transparent;color:inherit;font-weight:600;text-decoration:underline;padding:4px}

/* Wiederholungen, Feiertage, Ferien */
.rp{margin-left:4px;font-size:.9em;opacity:.75}
.pill.hol{background:color-mix(in srgb,var(--k) 13%,var(--surface));color:color-mix(in srgb,var(--k) 66%,var(--ink));border-color:color-mix(in srgb,var(--k) 32%,transparent);font-weight:500;cursor:default}
.pill.hol.xs{font-weight:600}
.row.hol{cursor:default;background:color-mix(in srgb,var(--k) 10%,var(--surface));border-color:color-mix(in srgb,var(--k) 28%,transparent)}
.row.hol .rt{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:color-mix(in srgb,var(--k) 66%,var(--ink))}
.mc.hday:not(.today) .num{color:var(--k-red);font-weight:700}
.mc.rng{background:color-mix(in srgb,var(--k) 14%,var(--surface))}
.mc.rng.out{background:color-mix(in srgb,var(--k) 7%,var(--bg))}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 2px 0;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:3px;background:var(--k)}
.rep-box{display:flex;flex-direction:column;gap:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.chiplist{display:flex;flex-wrap:wrap;gap:6px}
.chiplist:empty{display:none}
.xchip{display:inline-flex;align-items:center;gap:4px;min-height:34px;padding:0 4px 0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:500 12px/1 var(--mono)}
.xchip button{display:grid;place-items:center;width:28px;height:28px;padding:0;border:0;background:transparent;color:var(--ink-2)}
.setgrp{display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px solid var(--line)}

<body>
<div id="app">
  <header class="top" id="head"></header>
  <main id="main"></main>
</div>
<button class="fab" id="fab" type="button" data-act="new">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  Neu
</button>
<div id="sheet" role="dialog" aria-modal="true" data-act="sheet-close" hidden></div>
<div id="alerts"></div>
<div id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
document.documentElement.lang='de';

/* ---------- Hilfen ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var addDays=function(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)};
var mins=function(t){var p=String(t||'0:0').split(':').map(Number);return (p[0]||0)*60+(p[1]||0)};
var hhmm=function(m){return pad(Math.floor(m/60))+':'+pad(m%60)};
var today=function(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
var mondayOf=function(d){return addDays(d,-((d.getDay()+6)%7))};
var at=function(date,time){var a=date.split('-').map(Number),b=time.split(':').map(Number);return new Date(a[0],a[1]-1,a[2],b[0],b[1]).getTime()};
function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);var y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/86400000+1)/7)}
var fmtLong=function(d){return d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})};
var WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
var CATS=[['blue','Arbeit'],['green','Privat'],['amber','Familie'],['red','Gesundheit'],['violet','Lernen'],['slate','Sonstiges']];
var PRIO=[['0','Normal'],['1','Wichtig'],['2','Dringend']];

var ICON={
  chevL:'<path d="M15 5l-7 7 7 7"/>',chevR:'<path d="M9 5l7 7-7 7"/>',
  bell:'<path d="M6 9a6 6 0 1 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9z"/><path d="M10 19a2 2 0 0 0 4 0"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7"/>',close:'<path d="M6 6l12 12M18 6L6 18"/>'
};
function ic(n,s){var z=s||20;return '<svg viewBox="0 0 24 24" width="'+z+'" height="'+z+'" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[n]+'</svg>'}

var LS={
  get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
var prefs=Object.assign({sound:true,sys:false,view:'day',holHint:true},LS.get('tagwerk.prefs',{}));
prefs.hol=Object.assign({country:'DE',state:'',pub:true,school:true,mine:true},prefs.hol||{});
var savePrefs=function(){LS.set('tagwerk.prefs',prefs)};
/* ---------- Native Hülle (Capacitor/APK) ---------- */
var NATIVE=!!(window.Capacitor&&typeof window.Capacitor.isNativePlatform==='function'&&window.Capacitor.isNativePlatform());
var LN=(NATIVE&&window.Capacitor.Plugins)?window.Capacitor.Plugins.LocalNotifications:null;

var S={
  view:['day','week','month','agenda','todo'].indexOf(prefs.view)>-1?prefs.view:'day',
  cur:today(),sel:ymd(today()),items:new Map(),loading:true,slow:false,mode:'local',
  filter:'all',agendaDays:30,scroll:true,sheet:null,undo:null,fit:{day:56,week:40}
};

/* ---------- Speicher: privat pro Konto, sonst nur dieser Browser ---------- */
var cloud=null,chain={},seedChecked=false,loadTimer=null;
function newId(kind){return (kind==='event'?'e_':kind==='period'?'p_':'t_')+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function bodyOf(it){var b=Object.assign({},it);delete b.id;delete b._occ;delete b._k;return JSON.parse(JSON.stringify(b))}
function saveLocal(){LS.set('tagwerk.items',Array.from(S.items.values()))}
function persist(it){
  if(it._occ)return;
  S.items.set(it.id,it);
  if(cloud){
    var id=it.id,data=bodyOf(it);
    chain[id]=(chain[id]||Promise.resolve()).then(function(){return cloud.doc(id).set(data)}).catch(function(){toast('Speichern fehlgeschlagen. Prüfe die Verbindung und versuche es noch einmal.')});
  }else saveLocal();
}
function removeItem(id){
  var old=S.items.get(id);S.items.delete(id);
  if(cloud){chain[id]=(chain[id]||Promise.resolve()).then(function(){return cloud.doc(id).delete()}).catch(function(){toast('Löschen fehlgeschlagen.')})}
  else saveLocal();
  removeAlertsOf(id);
  return old;
}
function seedExamples(){
  var t=today(),d0=ymd(t),d1=ymd(addDays(t,1)),d2=ymd(addDays(t,2)),n=Date.now();
  var E=function(title,date,s,e,color,remind){return {kind:'event',title:title,date:date,start:s,end:e,allDay:false,color:color,note:'',remind:remind,example:true,createdAt:n}};
  var T=function(title,due,time,prio,remind){return {kind:'todo',title:title,done:false,due:due,time:time,prio:prio,note:'',remind:remind,example:true,createdAt:n}};
  [
    Object.assign(E('Team-Abstimmung',ymd(mondayOf(t)),'09:30','10:00','blue',10),{rep:{t:'weekdays',except:[],noHol:true}}),
    E('Mittagessen mit Anna',d0,'12:30','13:30','green',null),
    E('Fokuszeit: Angebot schreiben',d0,'14:00','16:00','blue',5),
    E('Sport',d0,'18:30','19:30','red',null),
    E('Zahnarzt',d1,'08:15','09:00','red',60),
    E('Elternabend',d2,'19:00','20:30','amber',null),
    T('Steuerbelege sortieren',d0,'',2,null),
    T('Päckchen abholen',d0,'17:30',0,15),
    T('Geschenk besorgen',d1,'',1,null),
    T('Wäsche machen','','',0,null)
  ].forEach(function(o,i){o.id=newId(o.kind)+i;persist(o)});
}
function startCloud(col){
  cloud=col;S.mode='cloud';
  loadTimer=setTimeout(function(){if(S.loading){S.loading=false;S.slow=true;render({keep:true})}},10000);
  col.onSnapshot(function(snap){
    var m=new Map(),meta=false;
    snap.docs.forEach(function(d){
      var v=d.data();if(!v)return;
      if(v.kind==='meta'){meta=true;return}
      if(v.kind==='event'||v.kind==='todo'||v.kind==='period')m.set(d.id,Object.assign({},v,{id:d.id}));
    });
    S.items=m;
    if(!snap.metadata.fromCache){
      S.loading=false;S.slow=false;clearTimeout(loadTimer);
      if(!seedChecked){
        seedChecked=true;
        if(!meta){col.doc('meta').set({kind:'meta',seeded:true,at:Date.now()}).catch(function(){});seedExamples()}
      }
    }
    render({keep:true});
    if(!S.loading)checkReminders();
  },function(){
    S.loading=false;clearTimeout(loadTimer);
    toast('Die Verbindung zum Speicher wurde getrennt. Lade die Seite neu.');
    render({keep:true});
  });
}
function startLocal(){
  S.mode='local';
  var arr=LS.get('tagwerk.items',null);
  if(arr===null)seedExamples();else arr.forEach(function(i){S.items.set(i.id,i)});
  S.loading=false;
  render({keep:true});checkReminders();
}
async function init(){
  var col=null;
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      var r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      var uid=r[1]?await r[1].id():null;
      if(r[0]&&uid)col=r[0].collection('data/users/'+uid);
    }
  }catch(e){col=null}
  if(col)startCloud(col);else startLocal();
}

/* ---------- Auswahl ---------- */
var all=function(){return Array.from(S.items.values())};
var onDay=function(kind,d){
  var out=[];
  S.items.forEach(function(i){
    if(i.kind!==kind)return;
    if(i.rep){if(repOn(i,d))out.push(occ(i,d))}
    else if((kind==='event'?i.date:i.due)===d)out.push(i);
  });
  return out;
};
var eventsOn=function(d){return onDay('event',d)};
var todosOn=function(d){return onDay('todo',d)};
/* Aufgabenliste: normale Aufgaben plus der nächste Termin jeder Serie (ist der heutige erledigt, auch der folgende) */
function todoItems(){
  var out=[],tk=ymd(today());
  S.items.forEach(function(i){
    if(i.kind!=='todo')return;
    if(!i.rep){out.push(i);return}
    for(var n=0;n<400;n++){
      var k=ymd(addDays(today(),n));
      if(!repOn(i,k))continue;
      var o=occ(i,k);out.push(o);
      if(!(k===tk&&o.done))break;
    }
  });
  return out;
}
var cmpEv=function(a,b){return (b.allDay?1:0)-(a.allDay?1:0)||String(a.start||'').localeCompare(String(b.start||''))};
var cmpTodo=function(a,b){return (a.done?1:0)-(b.done?1:0)||String(a.due||'9999').localeCompare(String(b.due||'9999'))||String(a.time||'99:99').localeCompare(String(b.time||'99:99'))||(b.prio||0)-(a.prio||0)||(a.createdAt||0)-(b.createdAt||0)};
function dueLabel(due,time){
  if(!due)return '';
  var diff=Math.round((parse(due)-today())/86400000),s;
  if(diff===0)s='Heute';else if(diff===1)s='Morgen';else if(diff===-1)s='Gestern';
  else s=parse(due).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
  return s+(time?' · '+time:'');
}

/* ---------- Wiederholungen (Serien) ---------- */
function fmtShort(s,withYear){var o={day:'numeric',month:'short'};if(withYear)o.year='numeric';return parse(s).toLocaleDateString('de-DE',o)}
var PT={uni:['Uni','violet'],arbeit:['Arbeit','blue'],urlaub:['Urlaub','amber'],sonst:['Sonstiges','slate']};
function repMark(it){return it.rep?'<span class="rp" title="Wiederholt sich" aria-label="wiederholt sich">↻</span>':''}
var kk=function(it){return it._k||it.id};
function resolveKey(k){
  var i=String(k).indexOf('@');
  if(i<0)return {it:S.items.get(k),occ:null};
  return {it:S.items.get(k.slice(0,i)),occ:k.slice(i+1)};
}
/* Ein Tag einer Serie als eigener Eintrag (nur zur Anzeige, wird nie gespeichert) */
function occ(it,dk){
  var o=Object.assign({},it);
  if(it.kind==='event')o.date=dk;
  else{o.due=dk;o.done=!!(it.doneDates&&it.doneDates.indexOf(dk)>-1)}
  o._occ=dk;o._k=it.id+'@'+dk;
  return o;
}
function repOn(it,dk){
  var r=it.rep,base=it.kind==='event'?it.date:it.due;
  if(!r||!base||dk<base)return false;
  if(r.until&&dk>r.until)return false;
  var wd=parse(dk).getDay();
  var ok=r.t==='daily'||(r.t==='weekdays'&&wd>=1&&wd<=5)||(r.t==='weekend'&&(wd===0||wd===6))||(r.t==='custom'&&(r.days||[]).indexOf(wd)>-1);
  if(!ok)return false;
  if((r.except||[]).indexOf(dk)>-1)return false;
  if(r.noHol&&pubOn(dk).length)return false;
  if(r.noSchool&&schoolOn(dk).length)return false;
  if(r.noMine&&periodsOn(dk).length)return false;
  return true;
}
function repText(r){
  var t=r.t==='daily'?'täglich':r.t==='weekdays'?'Mo–Fr':r.t==='weekend'?'Sa, So':(r.days||[]).slice().sort(function(a,b){return (a+6)%7-(b+6)%7}).map(function(d){return WD[(d+6)%7]}).join(', ');
  var x=[];
  if(r.until)x.push('bis '+fmtShort(r.until,true));
  if((r.except||[]).length)x.push(r.except.length+(r.except.length>1?' Ausnahmen':' Ausnahme'));
  var sk=[];
  if(r.noHol)sk.push('Feiertage');
  if(r.noSchool)sk.push('Schulferien');
  if(r.noMine)sk.push('eigene Zeiträume');
  if(sk.length)x.push('ohne '+sk.join(', '));
  return t+(x.length?', '+x.join(', '):'');
}

/* ---------- Feiertage ---------- */
function easter(y){
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da);
}
function nthWd(y,m,wd,n){
  if(n>0){var f=new Date(y,m,1);return new Date(y,m,1+(wd-f.getDay()+7)%7+(n-1)*7)}
  var l=new Date(y,m+1,0);
  return new Date(y,m,l.getDate()-(l.getDay()-wd+7)%7);
}
function hD(y,m,d){return new Date(y,m-1,d)}
function hE(y,n){var e=easter(y);return new Date(e.getFullYear(),e.getMonth(),e.getDate()+n)}
function hBuss(y){var d=new Date(y,10,22);while(d.getDay()!==3)d.setDate(d.getDate()-1);return d}
var HOLS={
  DE:{name:'Deutschland',regions:{BW:'Baden-Württemberg',BY:'Bayern',BE:'Berlin',BB:'Brandenburg',HB:'Bremen',HH:'Hamburg',HE:'Hessen',MV:'Mecklenburg-Vorpommern',NI:'Niedersachsen',NW:'Nordrhein-Westfalen',RP:'Rheinland-Pfalz',SL:'Saarland',SN:'Sachsen',ST:'Sachsen-Anhalt',SH:'Schleswig-Holstein',TH:'Thüringen'},fn:function(y,r){
    var L=[[hD(y,1,1),'Neujahr'],[hE(y,-2),'Karfreitag'],[hE(y,1),'Ostermontag'],[hD(y,5,1),'Tag der Arbeit'],[hE(y,39),'Christi Himmelfahrt'],[hE(y,50),'Pfingstmontag'],[hD(y,10,3),'Tag der Deutschen Einheit'],[hD(y,12,25),'1. Weihnachtstag'],[hD(y,12,26),'2. Weihnachtstag']];
    var has=function(a){return a.indexOf(r)>-1};
    if(has(['BW','BY','ST']))L.push([hD(y,1,6),'Heilige Drei Könige']);
    if((r==='BE'&&y>=2019)||(r==='MV'&&y>=2023))L.push([hD(y,3,8),'Internationaler Frauentag']);
    if(r==='BB'){L.push([hE(y,0),'Ostersonntag']);L.push([hE(y,49),'Pfingstsonntag'])}
    if(has(['BW','BY','HE','NW','RP','SL']))L.push([hE(y,60),'Fronleichnam']);
    if(r==='SL')L.push([hD(y,8,15),'Mariä Himmelfahrt']);
    if(r==='BY')L.push([hD(y,8,15),'Mariä Himmelfahrt (in vielen Gemeinden)']);
    if(r==='TH'&&y>=2019)L.push([hD(y,9,20),'Weltkindertag']);
    if(has(['BB','MV','SN','ST','TH'])||(has(['HB','HH','NI','SH'])&&y>=2018))L.push([hD(y,10,31),'Reformationstag']);
    if(has(['BW','BY','NW','RP','SL']))L.push([hD(y,11,1),'Allerheiligen']);
    if(r==='SN')L.push([hBuss(y),'Buß- und Bettag']);
    return L;
  }},
  AT:{name:'Österreich',fn:function(y){return [[hD(y,1,1),'Neujahr'],[hD(y,1,6),'Heilige Drei Könige'],[hE(y,1),'Ostermontag'],[hD(y,5,1),'Staatsfeiertag'],[hE(y,39),'Christi Himmelfahrt'],[hE(y,50),'Pfingstmontag'],[hE(y,60),'Fronleichnam'],[hD(y,8,15),'Mariä Himmelfahrt'],[hD(y,10,26),'Nationalfeiertag'],[hD(y,11,1),'Allerheiligen'],[hD(y,12,8),'Mariä Empfängnis'],[hD(y,12,25),'Christtag'],[hD(y,12,26),'Stefanitag']]}},
  CH:{name:'Schweiz',note:'Es gelten nur die Feiertage, die in fast allen Kantonen frei sind.',fn:function(y){return [[hD(y,1,1),'Neujahr'],[hE(y,-2),'Karfreitag'],[hE(y,1),'Ostermontag'],[hE(y,39),'Auffahrt'],[hE(y,50),'Pfingstmontag'],[hD(y,8,1),'Bundesfeier'],[hD(y,12,25),'Weihnachten'],[hD(y,12,26),'Stephanstag']]}},
  FR:{name:'Frankreich',fn:function(y){return [[hD(y,1,1),'Neujahr'],[hE(y,1),'Ostermontag'],[hD(y,5,1),'Tag der Arbeit'],[hD(y,5,8),'Tag des Sieges 1945'],[hE(y,39),'Christi Himmelfahrt'],[hE(y,50),'Pfingstmontag'],[hD(y,7,14),'Nationalfeiertag'],[hD(y,8,15),'Mariä Himmelfahrt'],[hD(y,11,1),'Allerheiligen'],[hD(y,11,11),'Waffenstillstand 1918'],[hD(y,12,25),'Weihnachten']]}},
  IT:{name:'Italien',fn:function(y){return [[hD(y,1,1),'Neujahr'],[hD(y,1,6),'Heilige Drei Könige'],[hE(y,0),'Ostersonntag'],[hE(y,1),'Ostermontag'],[hD(y,4,25),'Tag der Befreiung'],[hD(y,5,1),'Tag der Arbeit'],[hD(y,6,2),'Tag der Republik'],[hD(y,8,15),'Mariä Himmelfahrt'],[hD(y,11,1),'Allerheiligen'],[hD(y,12,8),'Mariä Empfängnis'],[hD(y,12,25),'Weihnachten'],[hD(y,12,26),'Stefanstag']]}},
  ES:{name:'Spanien',note:'Es gelten nur die landesweiten Feiertage, die Regionen haben weitere.',fn:function(y){return [[hD(y,1,1),'Neujahr'],[hD(y,1,6),'Heilige Drei Könige'],[hE(y,-2),'Karfreitag'],[hD(y,5,1),'Tag der Arbeit'],[hD(y,8,15),'Mariä Himmelfahrt'],[hD(y,10,12),'Nationalfeiertag'],[hD(y,11,1),'Allerheiligen'],[hD(y,12,6),'Tag der Verfassung'],[hD(y,12,8),'Mariä Empfängnis'],[hD(y,12,25),'Weihnachten']]}},
  NL:{name:'Niederlande',fn:function(y){
    var k=hD(y,4,27);if(k.getDay()===0)k=hD(y,4,26);
    return [[hD(y,1,1),'Neujahr'],[hE(y,0),'Ostersonntag'],[hE(y,1),'Ostermontag'],[k,'Königstag'],[hE(y,39),'Christi Himmelfahrt'],[hE(y,49),'Pfingstsonntag'],[hE(y,50),'Pfingstmontag'],[hD(y,12,25),'1. Weihnachtstag'],[hD(y,12,26),'2. Weihnachtstag']];
  }},
  PL:{name:'Polen',fn:function(y){
    var L=[[hD(y,1,1),'Neujahr'],[hD(y,1,6),'Heilige Drei Könige'],[hE(y,0),'Ostersonntag'],[hE(y,1),'Ostermontag'],[hD(y,5,1),'Tag der Arbeit'],[hD(y,5,3),'Tag der Verfassung'],[hE(y,49),'Pfingstsonntag'],[hE(y,60),'Fronleichnam'],[hD(y,8,15),'Mariä Himmelfahrt'],[hD(y,11,1),'Allerheiligen'],[hD(y,11,11),'Unabhängigkeitstag'],[hD(y,12,25),'1. Weihnachtstag'],[hD(y,12,26),'2. Weihnachtstag']];
    if(y>=2025)L.push([hD(y,12,24),'Heiligabend']);
    return L;
  }},
  GB:{name:'Vereinigtes Königreich (England und Wales)',fn:function(y){

  return m[dk]||[];
}
function schoolOn(dk){
  var h=prefs.hol;if(h.country!=='DE'||!h.state)return [];

  for(var i=0;i<L.length;i++){var r=L[i];if(dk>=r[0]&&dk<=r[1])out.push({name:r[2],start:r[0],end:r[1]})}

function rangeLabel(a,b){
  if(a.getMonth()===b.getMonth())return a.getDate()+'.–'+b.getDate()+'. '+b.toLocaleDateString('de-DE',{month:'long'});
  var f=function(d){return d.toLocaleDateString('de-DE',{day:'numeric',month:'short'})};
  return f(a)+' – '+f(b);
}
function headHTML(){

  else if(v==='week'){var m=mondayOf(c);kicker='KW '+isoWeek(m)+' · '+m.getFullYear();title=rangeLabel(m,addDays(m,6))}
  else if(v==='month'){kicker='Monat';title=c.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}

/* ---------- Zeitraster ---------- */
function layoutDay(list){
  var arr=list.map(function(x){return {it:x.it,s:x.s,e:Math.max(x.e,x.s+30)}}).sort(function(a,b){return a.s-b.s||b.e-a.e});
  var out=[],cluster=[],cEnd=-1;
  function flush(){
    if(!cluster.length)return;
    var cols=[];
    cluster.forEach(function(p){
      var c=cols.findIndex(function(end){return end<=p.s});
      if(c<0){c=cols.length;cols.push(p.e)}else cols[c]=p.e;
      p.col=c;
    });
    cluster.forEach(function(p){p.cols=cols.length;out.push(p)});
    cluster=[];
  }
  arr.forEach(function(p){
    if(cluster.length&&p.s>=cEnd){flush();cEnd=-1}
    cluster.push(p);cEnd=Math.max(cEnd,p.e);
  });
  flush();return out;
}
function placements(dk){
  var list=[];
  eventsOn(dk).filter(function(e){return !e.allDay&&e.start}).forEach(function(e){
    var s=mins(e.start),en=e.end?mins(e.end):s+60;if(en<=s)en=Math.min(s+60,1440);list.push({it:e,s:s,e:en});
  });
  todosOn(dk).filter(function(t){return t.time}).forEach(function(t){var s=mins(t.time);list.push({it:t,s:s,e:s+30})});
  return layoutDay(list);
}
function blockHTML(p,hh,compact){

/* ---------- Aufgaben ---------- */
function todoRow(t){
  var tk=ymd(today()),late=!t.done&&t.due&&t.due<tk;
  var meta=[];
  if(t.due)meta.push('<span>'+(late?'Überfällig · ':'')+esc(dueLabel(t.due,t.time))+'</span>');
  if(t.remind!=null&&t.due)meta.push('<span>Erinnerung</span>');
  if(t.rep)meta.push('<span><span class="rpg">↻</span> '+esc(repText(t.rep))+'</span>');
  var tag=t.prio===2?'<span class="tag k-red">Dringend</span>':t.prio===1?'<span class="tag k-amber">Wichtig</span>':'';
  return '<div class="row trow'+(t.done?' done':'')+'" role="button" tabindex="0" data-act="edit" data-id="'+kk(t)+'"><button type="button" class="cbx" data-act="toggle" data-id="'+kk(t)+'" aria-pressed="'+!!t.done+'" aria-label="Aufgabe erledigt"><i>'+ic('check',14)+'</i></button><span class="rmain"><span class="rtitle">'+esc(t.title)+'</span>'+((meta.length||tag)?'<span class="rmeta'+(late?' late':'')+'">'+meta.join('')+tag+'</span>':'')+'</span></div>';

function todoHTML(){
  var tk=ymd(today()),f=S.filter,todos=todoItems();
  var pass=function(t){return f==='today'?(t.due&&t.due<=tk):f==='high'?(t.prio>=1):true};
  var open=todos.filter(function(t){return !t.done&&pass(t)}).sort(cmpTodo);
  var done=todos.filter(function(t){return t.done&&(f==='today'?t.due===tk:f==='high'?t.prio>=1:true)}).sort(function(a,b){return (b.doneAt||0)-(a.doneAt||0)});
  var groups=[
    ['Überfällig',open.filter(function(t){return t.due&&t.due<tk}),'late'],
    ['Heute',open.filter(function(t){return t.due===tk}),''],
    ['Demnächst',open.filter(function(t){return t.due&&t.due>tk}),''],
    ['Ohne Datum',open.filter(function(t){return !t.due}),'']
  ];
  var tdAll=todos.filter(function(t){return t.due===tk}),tdDone=tdAll.filter(function(t){return t.done}).length;
  var prog=tdAll.length?'<div class="prog"><span>'+tdDone+' von '+tdAll.length+' für heute erledigt</span><span class="bar"><i style="width:'+Math.round(tdDone/tdAll.length*100)+'%"></i></span></div>':'';
  var chips=[['all','Alle'],['today','Heute'],['high','Wichtig']].map(function(c){return '<button type="button" class="chip" data-act="filter" data-f="'+c[0]+'" aria-pressed="'+(f===c[0])+'">'+c[1]+'</button>'}).join('');
  var out='<form class="quick" id="quickForm" autocomplete="off"><input id="quick" type="text" maxlength="120" placeholder="Neue Aufgabe eingeben" aria-label="Neue Aufgabe"><button class="btn pri" type="submit">Hinzufügen</button></form><div class="chips">'+chips+'</div>'+prog;
  var n=0;
  groups.forEach(function(g){if(g[1].length){n+=g[1].length;out+='<section class="sec '+g[2]+'"><h2>'+g[0]+' · '+g[1].length+'</h2><div class="rows">'+g[1].map(todoRow).join('')+'</div></section>'}});
  if(!n)out+='<p class="hint">'+(f==='all'?'Keine offenen Aufgaben. Schreib oben eine neue hinein.':'Dazu gibt es keine offenen Aufgaben.')+'</p>';
  if(done.length)out+='<section class="sec"><h2>Erledigt · '+done.length+'</h2><div class="rows">'+done.slice(0,20).map(todoRow).join('')+'</div><div class="more"><button type="button" class="btn sm" data-act="clear-done">Erledigte entfernen</button></div></section>';

function render(opts){
  opts=opts||{};

  var qi=document.getElementById('quick'),qv=qi?qi.value:'',qf=qi&&document.activeElement===qi;

  main.classList.toggle('slide-prev',S.anim==='prev');

  if(q2&&qv){q2.value=qv}

/* Zeitraster an die Bildschirmhöhe anpassen: bleibt unten Platz frei, wird jede Stunde höher.
   Auf einem normalen Handy ist das Raster höher als der Bildschirm und scrollt wie gewohnt. */
function fitGrid(main){
  var v=S.view;if(v!=='day'&&v!=='week')return false;
  var g=main.querySelector('.grid,.wgrid');if(!g)return false;
  var base=v==='day'?56:40,cur=S.fit[v];
  var pb=parseFloat(getComputedStyle(main).paddingBottom)||0;
  var free=main.clientHeight-pb-(g.offsetTop+g.offsetHeight);
  var next=Math.max(base,Math.min(Math.floor(cur+free/24),140));
  if(next===cur)return false;
  S.fit[v]=next;return true;
}
function scrollGrid(){
  var main=$('#main');
  if(S.view!=='day'&&S.view!=='week'){main.scrollTop=0;return}
  var hh=S.view==='day'?S.fit.day:S.fit.week,target=7*60,n=new Date(),nowM=n.getHours()*60+n.getMinutes();
  if(S.view==='day'){
    var dk=ymd(S.cur);
    if(dk===ymd(n))target=Math.max(0,nowM-90);
    else{var ms=eventsOn(dk).filter(function(e){return !e.allDay&&e.start}).map(function(e){return mins(e.start)});if(ms.length)target=Math.max(0,Math.min.apply(null,ms)-60)}
  }else{
    var m=mondayOf(S.cur),inWeek=ymd(today())>=ymd(m)&&ymd(today())<=ymd(addDays(m,6));
    if(inWeek)target=Math.max(0,nowM-90);
  }
  var g=main.querySelector('.grid,.wgrid'),sh=main.querySelector('.wk-top,.strip');
  main.scrollTop=Math.max(0,(g?g.offsetTop:0)+target*hh/60-(sh?sh.offsetHeight:0));
}
function updateNow(){
  var n=new Date(),m=n.getHours()*60+n.getMinutes();
  document.querySelectorAll('.nowline').forEach(function(el){el.style.top=(m*Number(el.dataset.hh)/60)+'px'});
}

function baseTime(it){

  if(it.kind==='event'){if(!it.allDay&&it.start)t=it.start}else if(it.time)t=it.time;

function endTime(it,base){
  if(it.kind==='event'&&!it.allDay&&it.end)return at(it.date,it.end);
  if(it.kind==='todo'&&it.time)return base+120*60000;
  return at(it.kind==='event'?it.date:it.due,'23:59');
}

function alertMeta(it,base){
  if(it.kind==='test')return 'Test';
  var date=it.kind==='event'?it.date:it.due,hasT=(it.kind==='event'&&!it.allDay&&it.start)||(it.kind==='todo'&&it.time);
  var tm=hasT?(it.kind==='event'?it.start:it.time):'',diff=Math.round((base-Date.now())/60000),rel;
  if(!hasT)rel=it.kind==='event'?'ganztägig':'fällig';
  else if(diff>1)rel='in '+fmtDur(diff);else if(diff>=-1)rel='jetzt';else rel='seit '+fmtDur(-diff);
  var dl=date&&date!==ymd(today())?dueLabel(date,'')+' · ':'';

function checkReminders(){
  var now=Date.now(),dirty=false;
  nativeSync();
  Object.keys(snoozed).forEach(function(k){
    var r=resolveKey(k),it=r.it;
    if(it&&r.occ)it=repOn(it,r.occ)?occ(it,r.occ):null;
    if(!it){delete snoozed[k];dirty=true;return}
    if(now>=snoozed[k]){delete snoozed[k];dirty=true;showAlert(it,baseTime(it)||now)}
  });
  var cand=[],t0=today();
  S.items.forEach(function(it){
    if(it.kind!=='event'&&it.kind!=='todo')return;
    if(it.rep){for(var o=-1;o<=2;o++){var dk=ymd(addDays(t0,o));if(repOn(it,dk))cand.push(occ(it,dk))}}
    else cand.push(it);
  });
  cand.forEach(function(it){
    if(it.remind==null||it.remind==='')return;
    if(it.kind==='todo'&&it.done)return;
    var base=baseTime(it);if(base==null)return;
    var ft=base-Number(it.remind)*60000,key=kk(it)+'@'+ft;
    if(ft<=now&&now<endTime(it,base)&&!fired.has(key)){fired.add(key);dirty=true;showAlert(it,base)}

    var keep=[],lim=now-3*86400000;
    fired.forEach(function(k){var ft=Number(k.split('@').pop());if(ft>lim)keep.push(k)});
    fired=new Set(keep);LS.set('tagwerk.fired',keep);LS.set('tagwerk.snooze',snoozed);
  }
}

function nativePlan(){
  var now=Date.now(),horizon=now+14*86400000,list=[],t0=today(),cand=[];
  S.items.forEach(function(it){
    if(it.kind!=='event'&&it.kind!=='todo')return;

function clearExamples(){
  all().filter(function(i){return i.example}).forEach(function(i){removeItem(i.id)});
  if($('#sheet').hidden===false&&S.sheet&&S.sheet.type==='settings')closeSheet();
  render({keep:true});
}

/* ---------- Bedienung ---------- */
function navigate(dir){
  var c=S.cur;
  if(S.view==='day')S.cur=addDays(c,dir);
  else if(S.view==='week')S.cur=addDays(c,7*dir);
  else{
    var n=new Date(c.getFullYear(),c.getMonth()+dir,1),t=today();
    S.cur=(n.getFullYear()===t.getFullYear()&&n.getMonth()===t.getMonth())?t:n;
  }
  S.sel=ymd(S.cur);S.scroll=true;S.anim=dir>0?'next':'prev';render();
}

/* ---------- Wischen mit einem Finger ----------
   Hoch/runter scrollt der Browser selbst (touch-action: pan-y auf #main).
   Links/rechts wechselt in Tag, Woche und Monat zum vorherigen oder nächsten Zeitraum. */
var sw=null,swipedAt=0;
function swipeAllowed(t){
  if(S.sheet)return false;
  if(S.view!=='day'&&S.view!=='week'&&S.view!=='month')return false;
  return !(t&&t.closest&&t.closest('input,textarea,select,#sheet,#alerts,#fab'));
}
document.addEventListener('touchstart',function(e){
  if(e.touches.length!==1||!swipeAllowed(e.target)){sw=null;return}
  var p=e.touches[0];
  if(p.clientX<16||p.clientX>window.innerWidth-16){sw=null;return}
  sw={x:p.clientX,y:p.clientY,t:Date.now()};
},{passive:true});
document.addEventListener('touchmove',function(e){if(sw&&e.touches.length!==1)sw=null},{passive:true});
document.addEventListener('touchcancel',function(){sw=null},{passive:true});
document.addEventListener('touchend',function(e){
  if(!sw)return;
  var p=e.changedTouches[0],dx=p.clientX-sw.x,dy=p.clientY-sw.y,dt=Date.now()-sw.t;
  sw=null;
  if(Math.abs(dx)<56||Math.abs(dx)<Math.abs(dy)*1.6||dt>800)return;
  swipedAt=Date.now();
  navigate(dx<0?1:-1);
},{passive:true});
/* Nach einem Wisch kein versehentliches Antippen auslösen */
document.addEventListener('click',function(e){
  if(Date.now()-swipedAt<120){e.preventDefault();e.stopImmediatePropagation()}
},true);

document.addEventListener('pointerdown',unlockAudio,{passive:true});
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t){
    var cols=e.target.closest('.cols');
    if(cols&&!S.sheet)gridNew(cols,e);
    return;
  }
  var a=t.dataset.act,id=t.dataset.id;
  if(t.id==='sheet'&&e.target!==t)return;
  switch(a){
    case 'view':S.view=t.dataset.v;prefs.view=S.view;savePrefs();S.scroll=true;render();break;
    case 'prev':navigate(-1);break;
    case 'next':navigate(1);break;
    case 'today':S.cur=today();S.sel=ymd(S.cur);S.scroll=true;render();break;
    case 'goday':S.cur=parse(t.dataset.date);S.sel=t.dataset.date;S.view='day';prefs.view='day';savePrefs();S.scroll=true;render();break;
    case 'seldate':S.sel=t.dataset.date;render({keep:true});break;
    case 'new':openSheet(newSpec());break;
    case 'edit':{var r0=resolveKey(id);if(r0.it)openSheet({item:r0.it,occ:r0.occ})}break;
    case 'toggle':toggleTodo(id);break;
    case 'filter':S.filter=t.dataset.f;render({keep:true});break;
    case 'more':S.agendaDays+=30;render({keep:true});break;
    case 'clear-done':{var n=0;all().filter(function(i){return i.kind==='todo'&&i.done}).forEach(function(i){removeItem(i.id);n++});render({keep:true});if(n)toast(n+' erledigte Aufgaben entfernt.')}break;
    case 'clear-examples':clearExamples();break;
    case 'hol-hint-off':prefs.holHint=false;savePrefs();render({keep:true});break;
    case 'sheet-skip':skipOccurrence();break;
    case 'ex-add':addExcept();break;
    case 'ex-del':{var xs=S.sheet&&S.sheet.ex;if(xs){var xi=xs.indexOf(t.dataset.date);if(xi>-1)xs.splice(xi,1);$('#exList').innerHTML=exChips(xs)}}break;
    case 'period-add':addPeriod();break;
    case 'period-del':{var po=removeItem(id);if(po){reopenSettings();render({keep:true});toast('Zeitraum „'+po.name+'“ gelöscht.')}}break;
    case 'settings':openSheet({type:'settings'});break;
    case 'sheet-close':closeSheet();break;
    case 'sheet-save':saveSheet();break;
    case 'sheet-delete':deleteFromSheet();break;
    case 'sheet-type':{
      var cur=S.sheet,tt=$('#f-title'),dd=$('#f-date')||$('#f-due');
      var df=Object.assign({},cur.defaults||{});if(tt)df.title=tt.value;
      if(dd&&dd.value){df.date=dd.value;df.due=dd.value}
      openSheet({type:t.dataset.type,defaults:df});
    }break;
    case 'snooze':{snoozed[id]=Date.now()+10*60000;LS.set('tagwerk.snooze',snoozed);removeAlert(id);toast('Erinnerung in 10 Minuten.');nativeSync()}break;
    case 'alert-done':toggleTodo(id);break;
    case 'dismiss':removeAlert(id);break;
    case 'undo':if(S.undo){persist(S.undo);S.undo=null;$('#toast').hidden=true;render({keep:true})}break;
    case 'test-alert':unlockAudio();showAlert({id:'test'+Date.now(),kind:'test',title:'So sieht eine Erinnerung aus'},Date.now());break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='f-allday'){$('#timeRow').hidden=t.checked}
  else if(t.id==='f-start'){var en=$('#f-end');if(en&&(!en.value||mins(en.value)<=mins(t.value)))en.value=hhmm(Math.min(mins(t.value)+60,23*60+59))}
  else if(t.id==='f-due'){var on=!!t.value;$('#f-time').disabled=!on;$('#f-remind').disabled=!on;var fr=$('#f-rep');if(fr){fr.disabled=!on;var rn=$('#repNote');if(rn)rn.hidden=on;syncRep()}}
  else if(t.id==='f-rep'){syncRep()}
  else if(t.id==='h-country'){prefs.hol.country=t.value;prefs.hol.state='';holCache={};savePrefs();reopenSettings();render({keep:true})}
  else if(t.id==='h-state'){prefs.hol.state=t.value;holCache={};savePrefs();reopenSettings();render({keep:true})}
  else if(t.id==='h-pub'||t.id==='h-school'||t.id==='h-mine'){prefs.hol[t.id.slice(2)]=t.checked;savePrefs();render({keep:true})}
  else if(t.id==='s-sound'){prefs.sound=t.checked;savePrefs();if(t.checked)unlockAudio()}
  else if(t.id==='s-sys'){
    var hint=$('#s-hint');
    if(!t.checked){prefs.sys=false;savePrefs();if(NATIVE)nativeCancelAll();return}
    var fail=function(){t.checked=false;prefs.sys=false;savePrefs();if(hint)hint.textContent=NATIVE?'Tagwerk darf keine Mitteilungen senden. Erlaube sie in den Android-Einstellungen unter Apps › Tagwerk › Benachrichtigungen.':'Dieses Gerät lässt hier keine Systemmitteilungen zu. Erinnerungen erscheinen in der App, solange sie geöffnet ist.'};
    if(NATIVE){nativeEnable().then(function(ok){if(ok){prefs.sys=true;savePrefs();nativeSig='';nativeSync()}else fail()});return}
    if(!('Notification' in window)){fail();return}
    try{Promise.resolve(Notification.requestPermission()).then(function(p){if(p==='granted'){prefs.sys=true;savePrefs()}else fail()}).catch(fail)}catch(err){fail()}
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='quickForm')return;
  e.preventDefault();
  var inp=$('#quick'),v=inp.value.trim();if(!v)return;
  persist({id:newId('todo'),kind:'todo',title:v,done:false,due:S.filter==='today'?ymd(today()):'',time:'',prio:S.filter==='high'?1:0,note:'',remind:null,createdAt:Date.now()});
  inp.value='';render({keep:true});
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.sheet){closeSheet();return}
  if(e.key==='Enter'&&S.sheet&&e.target.id==='f-title'){e.preventDefault();saveSheet();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click()}
});

/* Bildschirm gedreht oder Größe geändert: Raster neu einpassen */
var rzT=null;
window.addEventListener('resize',function(){
  clearTimeout(rzT);
  rzT=setTimeout(function(){if(!S.sheet)render({keep:true})},150);
});

var lastDay=ymd(new Date());
setInterval(function(){
  checkReminders();updateNow();
  var dk=ymd(new Date());
  if(dk!==lastDay){lastDay=dk;render({keep:true})}
},15000);

render();
init();
})();
</script>
