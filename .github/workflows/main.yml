name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: App-Symbol erzeugen
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#13202C' --iconBackgroundColorDark '#13202C' || echo "Symbol übersprungen"

      - name: Berechtigungen und Mitteilungs-Symbol ergänzen
        run: node scripts/patch-android.mjs

      - name: Web-Dateien synchronisieren
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Tagwerk-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
